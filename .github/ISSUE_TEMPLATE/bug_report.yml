name: Website or documentation bug
description: Report an accuracy, accessibility, or website issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never post a seed phrase, private key, wallet password, or personal data."
  - type: textarea
    id: issue
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
